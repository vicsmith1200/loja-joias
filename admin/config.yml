backend:
  name: git-gateway
  branch: main

locale: pt
media_folder: uploads
public_folder: /uploads

collections:
  - name: produtos
    label: "Produtos (catálogo)"
    files:
      - name: catalogo
        label: "Lista de produtos"
        file: data/produtos.json
        format: json
        fields:
          - label: "Produtos"
            name: produtos
            widget: list
            label_singular: "produto"
            summary: "{{fields.nome}} — R$ {{fields.preco}}"
            fields:
              - { label: "Nome", name: nome, widget: string }
              - { label: "Categoria", name: categoria, widget: string, hint: "Ex.: Anéis, Colares, Brincos. Escreva sempre igual para agrupar certo." }
              - { label: "Preço (R$)", name: preco, widget: number, value_type: float, min: 0, step: 0.01, hint: "Só números. Ex.: 289.90" }
              - { label: "Preço antigo (R$)", name: preco_antigo, widget: number, value_type: float, min: 0, step: 0.01, required: false, hint: "Opcional. Aparece riscado ao lado do preço (oferta)." }
              - { label: "Selo", name: selo, widget: string, required: false, hint: "Opcional. Ex.: Novo, Oferta, Mais vendido." }
              - { label: "Descrição", name: descricao, widget: text, required: false }
              - { label: "Fotos (a primeira é a principal)", name: fotos, widget: list, field: { label: "Foto", name: foto, widget: image }, hint: "Adicione quantas fotos quiser." }
              - { label: "Destaque (aparece primeiro)", name: destaque, widget: boolean, default: false }
              - { label: "Esgotado", name: esgotado, widget: boolean, default: false }

  - name: configuracoes
    label: "Dados da loja"
    files:
      - name: loja
        label: "Nome, WhatsApp e textos"
        file: data/config.json
        format: json
        fields:
          - { label: "Nome da loja", name: nome_loja, widget: string }
          - { label: "Aviso no topo do site", name: aviso, widget: string, required: false }
          - { label: "Frase de destaque", name: slogan, widget: string, required: false }
          - { label: "Título da capa", name: hero_titulo, widget: string, required: false }
          - { label: "Texto da capa", name: hero_texto, widget: text, required: false }
          - { label: "Foto da capa", name: hero_imagem, widget: image, required: false }
          - { label: "WhatsApp (com DDI e DDD, só números)", name: whatsapp, widget: string, hint: "Ex.: 5511999999999" }
          - { label: "Link do Instagram", name: instagram, widget: string, required: false, hint: "Cole o endereço completo do perfil. Ex.: https://instagram.com/couplejoias. Deixe vazio para não mostrar." }
          - { label: "Sobre a loja", name: sobre, widget: text, required: false }
